<article class="card game-card mb-3">
  <div class="card-body d-flex justify-content-between align-items-center">
    <div>
      <h2 class="h5 card-title">
        <a href="{% url 'catalog:detail' game.id %}">
          {{ game.title|default:"Без названия" }}
        </a>
      </h2>
      <p class="card-text text-muted mb-0">
        {{ game.release_year }} · {{ game.category.name }}
      </p>
    </div>
    {% include "includes/score_badge.html" with score=average %}
  </div>
</article>
